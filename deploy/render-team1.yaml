# Render Blueprint for Team 1's separate Sprint 3 build (https://ipp-team1.onrender.com).
# The model key is read from the existing ipp-master service; no value is stored here.
services:
  - type: web
    name: ipp-team1
    runtime: node
    region: frankfurt
    plan: free
    repo: https://github.com/GravityCodez/ipp-coop
    branch: p01/student-profiles
    buildCommand: npx -y bun@1.4.0 install --frozen-lockfile && NITRO_PRESET=node-server npx -y bun@1.4.0 run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: GROQ_API_KEY
        fromService:
          type: web
          name: ipp-master
          envVarKey: GROQ_API_KEY
